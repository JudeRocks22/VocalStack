name: Build Windows installer

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build VST3
        run: cmake --build build --config Release --parallel

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\VocalStack.iss'

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: VocalStack-Setup
          path: installer/Output/VocalStack-Setup.exe

      - name: Upload raw VST3
        uses: actions/upload-artifact@v4
        with:
          name: VocalStack-VST3
          path: build/VocalStack_artefacts/Release/VST3/VocalStack.vst3
